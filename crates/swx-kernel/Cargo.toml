[package]
name = "swx-kernel"
version = "0.0.1"
description = "Saulitwerx geometry kernel: B-rep operations, with OpenCascade behind the optional `occt` feature."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Links the system OpenCascade (OCCT) shared libraries through a small C ABI shim.
occt = ["dep:cc"]

[dependencies]

[build-dependencies]
cc = { version = "1", optional = true }

[lints]
workspace = true

[[example]]
name = "plate_with_hole"
required-features = ["occt"]

[[example]]
name = "plate_stages"
required-features = ["occt"]

[[example]]
name = "extrude_plate"
required-features = ["occt"]

[[example]]
name = "extrude_slot"
required-features = ["occt"]

[[example]]
name = "extrude_modes"
required-features = ["occt"]

[[example]]
name = "extrude_through_all"
required-features = ["occt"]

[[example]]
name = "revolve_bushing"
required-features = ["occt"]
