[package]
name = "swx-io"
version = "0.0.1"
description = "Saulitwerx file I/O: the native .sltwx family (manifest.json and the canonical JSON writer)."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Forwards to `swx-kernel/occt`, so `export_stl` can tessellate real shapes.
occt = ["swx-kernel/occt"]

[dependencies]
swx-kernel = { path = "../swx-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
crc32fast = "1"

[lints]
workspace = true

[[example]]
name = "export_part_stl"
required-features = ["occt"]

[[example]]
name = "import_step_part"
required-features = ["occt"]
