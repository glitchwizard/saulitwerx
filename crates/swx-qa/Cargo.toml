[package]
name = "swx-qa"
version = "0.0.1"
description = "Saulitwerx QA tooling: headless CPU renders of kernel meshes and sketch plots for review evidence."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Enables `swx-qa render --step` and `swx-qa thumbnail`, which import,
# read and tessellate shapes through OCCT.
occt = ["swx-kernel/occt", "swx-io/occt"]

[dependencies]
png = "0.17"
swx-io = { path = "../swx-io" }
swx-kernel = { path = "../swx-kernel" }
swx-sketch = { path = "../swx-sketch" }

[lints]
workspace = true

[[example]]
name = "stl_fineness"
required-features = ["occt"]
